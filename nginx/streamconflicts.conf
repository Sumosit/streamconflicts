# Активная конфигурация сайта.
#
# Пути к сертификатам должны совпадать с тем, что показывает `certbot certificates`.
# Перед применением обязательно `nginx -t`: при несовпадении путей проверка
# упадёт и старая конфигурация останется рабочей.

# --- dev: без HTTPS, закрыт от индексации ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.streamconflicts.com;
    client_max_body_size 8m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8001/api/seo/robots;
        include proxy_params;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8001/api/seo/sitemap;
        include proxy_params;
    }

    location = /rss.xml {
        proxy_pass http://127.0.0.1:8001/api/seo/rss;
        include proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- prod: HTTP только редиректит на HTTPS -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name streamconflicts.com www.streamconflicts.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://streamconflicts.com$request_uri;
    }
}

# --- prod: основной блок -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name streamconflicts.com www.streamconflicts.com;
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/streamconflicts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamconflicts.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.streamconflicts.com) {
        return 301 https://streamconflicts.com$request_uri;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8002/api/seo/robots;
        include proxy_params;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8002/api/seo/sitemap;
        include proxy_params;
    }

    location = /rss.xml {
        proxy_pass http://127.0.0.1:8002/api/seo/rss;
        include proxy_params;
    }

    location = /editor {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:8082;
        include proxy_params;
    }

    location ^~ /editor/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:8082;
        include proxy_params;
    }

    # Англоязычная версия. Отдельные контейнеры и отдельная база.
    # При переносе на другой сервер здесь меняются только адреса proxy_pass.
    location = /en/robots.txt {
        proxy_pass http://127.0.0.1:8003/api/seo/robots;
        include proxy_params;
    }

    location = /en/sitemap.xml {
        proxy_pass http://127.0.0.1:8003/api/seo/sitemap;
        include proxy_params;
    }

    location = /en/rss.xml {
        proxy_pass http://127.0.0.1:8003/api/seo/rss;
        include proxy_params;
    }

    location ^~ /en/api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /en/uploads/ {
        proxy_pass http://127.0.0.1:8003/uploads/;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /en/editor {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:8083;
        include proxy_params;
    }

    # Канонический адрес раздела — со слешем, чтобы не плодить дубли в выдаче.
    location = /en {
        return 301 https://$host/en/;
    }

    location ^~ /en/ {
        proxy_pass http://127.0.0.1:8083;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8002;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
